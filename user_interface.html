<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Chatbot</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.js"></script>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <img src="/static/chatbot_icon.png" alt="Chatbot" class="chat-icon">
            <h2>ChatBot</h2>
        </div>
        <div class="chat-body">
            <div id="faq-section">
                <h3>Select a Question:</h3>
                <select id="faq-select" onchange="sendFAQ()">
                    <option value="">-- Choose a question --</option>
                    {% for question in faqs %}
                    <option value="{{ question }}">{{ question }}</option>
                    {% endfor %}
                </select>
            </div>
            <div id="chat-messages" class="chat-messages"></div>
            <textarea id="message-input" placeholder="Type a message..."></textarea>
            <div class="chat-controls">
                <button onclick="connectToAgent()">Talk to Agent</button>
                <input type="file" id="file-upload" style="display: none;" onchange="uploadFile()">
                <button onclick="document.getElementById('file-upload').click()">Upload File</button>
                <button onclick="sendMessage()">Send</button>
                <button onclick="endChat()">End Chat</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const room = 'chatroom';
        const username = 'AL-Gawhara';

        // Join the room
        socket.emit('join_room', { room, username });

        // Handle bot responses
        socket.on('connect', () => {
            console.log('Socket.IO connected');
            socket.on('bot_response', (data) => {
                const chatMessages = document.getElementById('chat-messages');
                chatMessages.innerHTML += `<p><strong>ChatBot:</strong> ${data.response}</p>`;
                console.log('Bot response received:', data);
            });
        });

        // Handle incoming messages
        socket.on('message', (data) => {
            const chatMessages = document.getElementById('chat-messages');
            chatMessages.innerHTML += `<p><strong>${data.sender}:</strong> ${data.text}</p>`;
        });

        // Send a message
        function sendMessage() {
            const text = document.getElementById('message-input').value;
            if (text.trim() !== '') {
                socket.emit('send_message', { room, sender: username, text });
                document.getElementById('message-input').value = '';
            }
        }

        // Send selected FAQ
        function sendFAQ() {
            const faqSelect = document.getElementById('faq-select');
            const question = faqSelect.value;
            if (question) {
                socket.emit('send_faq', { room, question });
                const chatMessages = document.getElementById('chat-messages');
                chatMessages.innerHTML += `<p><strong>${username}:</strong> ${question}</p>`;
            }
        }

        // Request an agent
        function connectToAgent() {
            socket.emit('request_agent', { room, username });
            const chatMessages = document.getElementById('chat-messages');
            chatMessages.innerHTML += `<p><strong>system:</strong> Requesting an agent...</p>`;
        }

        // End chat and redirect to FAQ selection page
        function endChat() {
            socket.emit('leave_room', { room, username });
            alert('Chat ended');
            window.location.href = '/'; // Redirect to FAQ selection page
        }
// Handle file analysis results
// Handle file analysis results
socket.on('file_analysis_result', (data) => {
    const chatMessages = document.getElementById('chat-messages');
    let message = `<p><strong>File Analysis:</strong> <a href="${data.file_url}" target="_blank">${data.filename}</a> - Status: ${data.status}</p>`;
    if (Object.keys(data.probabilities).length > 0) {
        message += `<p><strong>Probabilities:</strong> ${JSON.stringify(data.probabilities)}</p>`;
    }
    chatMessages.innerHTML += message;
});
// Handle file uploads
socket.on('file_upload', (data) => {
    const chatMessages = document.getElementById('chat-messages');
    const fileLink = `<p><a href="${data.file_url}" target="_blank">${data.filename}</a></p>`;
    chatMessages.innerHTML += fileLink;
});

// Upload a file
function uploadFile() {
    const fileInput = document.getElementById('file-upload');
    const file = fileInput.files[0];
    if (file) {
        const formData = new FormData();
        formData.append('file', file);

        fetch('/upload', { method: 'POST', body: formData })
            .then((response) => response.json())
            .then((data) => {
                if (data.status === 'success') {
                    console.log(`File ${data.filename} uploaded successfully.`);
                } else {
                    console.error('File upload failed:', data.message);
                }
            });
    }
}
    </script>
</body>
